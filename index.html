<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>İŞLETME DEFTERİ</title>
<style>
:root{--nv:#1b2540;--bg:#f3f4f7;--ln:#e3e6ec;--tx:#1e2430;--mu:#6b7385;--rd:#c23b32;--gn:#1d8a5a;--bl:#2f5bd2}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:224px;background:var(--nv);color:#c9d0e4;padding:18px 12px;position:sticky;top:0;height:100vh;flex:none;overflow:auto}
aside h1{font-size:16px;letter-spacing:.5px;color:#fff;margin:4px 10px 18px}
aside a{display:block;padding:9px 12px;border-radius:9px;color:inherit;text-decoration:none;cursor:pointer;margin-bottom:2px}
aside a:hover{background:#27335a}aside a.on{background:#fff;color:var(--nv);font-weight:600}
main{flex:1;padding:24px;min-width:0;max-width:1200px;margin:0 auto}
h2{margin:0 0 16px;font-size:22px}h3{margin:0 0 12px;font-size:16px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.grid .card{margin:0}.k{color:var(--mu);font-size:13px}.v{font-size:24px;font-weight:700;margin-top:4px}
.red{color:var(--rd)}.grn{color:var(--gn)}.mu{color:var(--mu)}
.g2{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}.g2 .card{margin:0;height:100%}.g2 h3,.grid .card{text-align:center}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:13px;color:var(--mu);font-weight:600}td.r,th.r{text-align:right}.tw{overflow-x:auto}
button,.btn{font:inherit;border:1px solid var(--ln);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--tx)}
button:hover{background:#f0f2f6}button.pri{background:var(--bl);border-color:var(--bl);color:#fff}button.pri:hover{background:#2449ad}
button.gn{background:var(--gn);border-color:var(--gn);color:#fff}button.dg{color:var(--rd)}button.sm{padding:4px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd4de;border-radius:9px;width:100%;background:#fff}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}label input,label select,label textarea{margin-top:4px;color:var(--tx)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar input,.bar select{width:auto;min-width:170px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#e8ebf2}
.tag.g{background:#dcf3e8;color:var(--gn)}.tag.r{background:#fbe3e1;color:var(--rd)}.tag.o{background:#eee;color:#777}
dialog{border:0;border-radius:16px;padding:20px;width:min(560px,94vw);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0006}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.ctr{max-width:520px;margin:0 auto 16px}.ctr h3,.ctr p,.ctr .k{text-align:center}.ctr .bar{justify-content:center}input:disabled{background:#eef0f4;color:var(--mu);cursor:not-allowed}.err{color:var(--rd);margin:6px 0 0;min-height:1em}
.line{display:grid;grid-template-columns:2fr .8fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}.line input,.line select{margin:0}
.chart{display:flex;align-items:flex-end;gap:14px;height:140px;max-width:640px;margin:0 auto}.chart div{flex:1;text-align:center;font-size:11px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;border-radius:6px 6px 0 0;min-height:2px}.tot{font-size:22px;font-weight:700;text-align:right;margin:8px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:99}
ul.it{margin:0;padding-left:16px;font-size:13px}.empty{color:var(--mu);padding:14px 0}
@media(max-width:800px){.g2{grid-template-columns:minmax(0,1fr)}body{display:block}aside{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:8px;gap:4px}aside h1{display:none}aside a{white-space:nowrap}main{padding:14px}.line{grid-template-columns:1fr 1fr}}
#login{position:fixed;inset:0;background:var(--nv);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#login form{background:#fff;border-radius:16px;padding:28px;width:min(380px,100%);box-shadow:0 20px 60px #0006}#login h1{font-size:20px;margin:0 0 4px;color:var(--nv)}#login p.s{color:var(--mu);margin:0 0 18px}#login button{width:100%;padding:10px}
</style></head><body>
<div id="login"><form id="lf"><h1>İŞLETME DEFTERİ</h1><p class="s">Devam etmek için giriş yapın.</p><label>Kullanıcı ID<input id="lu" autocomplete="username" required></label><label>Şifre<input id="lp" type="password" autocomplete="current-password" required></label><p class="err" id="lerr"></p><button class="pri">Giriş yap</button></form></div>
<aside id="sb"></aside><main id="app"></main><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const K='isletmedefteri.v1',$=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cap=s=>s?s.charAt(0).toLocaleUpperCase('tr')+s.slice(1):'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=k=>(k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const toK=s=>Math.round(parseFloat(String(s).replace(',','.'))*100);
const dt=i=>i?new Date(i).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const day=i=>{const d=new Date(i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>day(new Date());
let S;try{S=JSON.parse(localStorage[K])}catch(e){}
const save=()=>{try{localStorage[K]=JSON.stringify(S)}catch(e){toast('Kayıt başarısız: depolama dolu olabilir')}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function seed(){
 const now=Date.now(),D=n=>new Date(now-n*864e5).toISOString();
 S={seq:0,persons:[],products:[],txs:[]};
 const P=(n,no,ph)=>{const p={id:uid(),name:n,no:nextNo(),phone:ph,note:'',created:D(20),active:true};S.persons.push(p);return p};
 const a=P('Ahmet Yılmaz','101','0532 000 00 01'),b=P('Ayşe Demir','102',''),c=P('Mehmet Kaya','','');
 const Q=(n,cat,pr,u)=>{const p={id:uid(),name:n,cat,price:pr*100,unit:u,active:true};S.products.push(p);return p};
 const cay=Q('Çay','İçecek',10,'Bardak'),kah=Q('Kahve','İçecek',30,'Bardak'),tost=Q('Tost','Yiyecek',80,'Adet'),sand=Q('Sandviç','Yiyecek',70,'Adet'),su=Q('Su','İçecek',10,'Adet');
 const sale=(p,items,d,note)=>addTx({type:'sale',pid:p.id,items:items.map(([pr,q])=>mkItem(pr,q,pr.price)),date:D(d),note});
 sale(a,[[cay,3],[tost,1],[su,2]],6,'');sale(a,[[kah,2],[sand,1]],3,'');sale(b,[[tost,2],[cay,2]],2,'');sale(c,[[sand,1],[su,1]],1,'');sale(a,[[cay,4]],0,'');
 addTx({type:'payment',pid:a.id,total:10000,method:'Nakit',date:D(2),note:'Kısmi ödeme',items:[]});
 save()}
function mkItem(p,q,u){return{pid:p.id,name:p.name,unit:p.unit,qty:q,price:u,total:Math.round(q*u)}}
function addTx(t){t.id=uid();t.no=++S.seq;t.date=t.date||new Date().toISOString();t.of=t.of||null;
 if(t.type=='sale')t.total=t.items.reduce((s,i)=>s+i.total,0);
 t.eff=t.type=='sale'?t.total:t.type=='payment'?-t.total:(t.ot=='sale'?-t.total:t.total);
 S.txs.push(t);return t}
function nextNo(){const m=Math.max(0,...S.persons.map(p=>parseInt(p.no)||0));return String(m+1).padStart(3,'0')}
if(!S||!S.persons)seed();
S.persons.filter(p=>!p.no).sort((a,b)=>a.created.localeCompare(b.created)).forEach(p=>p.no=nextNo());save();
const sd=t=>t.type=='sale'?t.total:t.ot=='sale'?-t.total:0,pd=t=>t.type=='payment'?t.total:t.ot=='payment'?-t.total:0;
const cancelled=id=>S.txs.some(t=>t.of==id);
function st(pid){let s=0,p=0,l=null;for(const t of S.txs)if(t.pid==pid){s+=sd(t);p+=pd(t);if(!l||t.date>l)l=t.date}return{spent:s,paid:p,bal:s-p,last:l}}
const pn=id=>{const p=S.persons.find(x=>x.id==id);return p?p.name:'?'};
const livePs=()=>S.persons.filter(p=>!p.deleted),actPs=()=>livePs().filter(p=>p.active),liveProd=()=>S.products.filter(p=>!p.deleted);
const TL={sale:'Alışveriş',payment:'Ödeme',reversal:'Düzeltme (İptal)'};
const items=t=>t.items&&t.items.length?'<ul class="it">'+t.items.map(i=>`<li>${i.qty} ${esc(i.name)} × ${fmt(i.price)} = ${fmt(i.total)}</li>`).join('')+'</ul>':(t.method?`<span class="mu">${esc(t.method)}</span>`:'');
const tag=t=>`<span class="tag ${t.type=='sale'?'r':t.type=='payment'?'g':'o'}">${TL[t.type]}${t.type=='reversal'?' · '+TL[t.ot]:''}</span>`;

/* dialog helpers */
function form(title,fields,ok){const d=$('#dlg');
 d.innerHTML=`<form method="dialog"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t=='area'?`<textarea name="${f.k}" rows="2">${esc(f.v)}</textarea>`:f.t=='dl'?`<input name="${f.k}" list="dl-${f.k}" value="${esc(f.v)}" placeholder="Listeden seçin veya yeni yazın" autocomplete="off"><datalist id="dl-${f.k}">${f.o.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.r?'required':''} ${f.d?'disabled':''} ${f.t=='number'?'step="any" min="0"':''}>`}</label>`).join('')}<p class="err"></p><div class="row"><button type="button" onclick="dlg.close()">Vazgeç</button><button class="pri">Kaydet</button></div></form>`;
 d.querySelector('form').onsubmit=e=>{const r=ok(Object.fromEntries(new FormData(e.target)));if(r){e.preventDefault();d.querySelector('.err').textContent=r}else{save();render()}};d.showModal()}
function modal(html){const d=$('#dlg');d.innerHTML=html+'<div class="row"><button onclick="dlg.close()">Kapat</button></div>';d.showModal()}

/* persons */
function editPerson(id){const p=S.persons.find(x=>x.id==id)||{name:'',no:'',phone:'',note:''};
 form(id?'Kişiyi düzenle':'Yeni kişi',[{k:'name',l:'Ad Soyad *',v:p.name,r:1},{k:'no',l:'Personel no (otomatik)',v:p.no||nextNo(),d:1},{k:'phone',l:'Telefon',v:p.phone},{k:'note',l:'Açıklama',v:p.note,t:'area'}],v=>{
  v.name=v.name.trim();if(!v.name)return 'Ad Soyad boş olamaz.';
  if(livePs().some(x=>x.id!=id&&x.name.toLowerCase()==v.name.toLowerCase()))return 'Bu isimde bir kişi zaten kayıtlı.';
  if(id)Object.assign(p,v);else S.persons.push({id:uid(),no:nextNo(),...v,created:new Date().toISOString(),active:true})})}
function togglePerson(id){const p=S.persons.find(x=>x.id==id);p.active=!p.active;save();render()}
function delPerson(id){const p=S.persons.find(x=>x.id==id),b=st(id).bal;
 if(b!=0)return alert('Bakiyesi sıfır olmayan kişi silinemez. Pasife alabilirsiniz.');
 if(confirm(p.name+' listeden kaldırılsın mı? Geçmiş finansal kayıtlar korunur.')){p.deleted=true;save();render()}}
function detail(id){const p=S.persons.find(x=>x.id==id),s=st(id),ts=S.txs.filter(t=>t.pid==id).sort((a,b)=>b.date.localeCompare(a.date));
 modal(`<h3>${esc(p.name)} ${p.active?'':'<span class="tag o">Pasif</span>'}</h3><p class="mu">${esc(p.no?'Sicil: '+p.no+' · ':'')}${esc(p.phone)} ${esc(p.note)}<br>Kayıt: ${dt(p.created)}</p>
 <div class="grid"><div class="card"><div class="k">Toplam harcama</div><div class="v">${fmt(s.spent)}</div></div><div class="card"><div class="k">Toplam ödeme</div><div class="v grn">${fmt(s.paid)}</div></div><div class="card"><div class="k">Güncel borç</div><div class="v ${s.bal>0?'red':''}">${fmt(s.bal)}</div></div><div class="card"><div class="k">Son işlem</div><div class="v" style="font-size:16px">${dt(s.last)}</div></div></div>
 <div class="tw"><table><tr><th>Tarih</th><th>Tür</th><th>Detay</th><th class="r">Tutar</th></tr>${ts.map(t=>`<tr><td>${dt(t.date)}</td><td>${tag(t)}</td><td>${items(t)}</td><td class="r">${fmt(t.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Henüz işlem yok.</td></tr>'}</table></div>`)}
function pPersons(){return `<h2>Kişi Yönetimi</h2><div class="bar"><button class="pri" onclick="editPerson()">+ Yeni kişi</button></div><div class="card tw"><table><tr><th>Ad Soyad</th><th>Sicil</th><th>Telefon</th><th>Durum</th><th class="r">Borç</th><th></th></tr>${livePs().map(p=>`<tr><td><a href="#" onclick="detail('${p.id}');return false">${esc(p.name)}</a></td><td>${esc(p.no)}</td><td>${esc(p.phone)}</td><td><span class="tag ${p.active?'g':'o'}">${p.active?'Aktif':'Pasif'}</span></td><td class="r ${st(p.id).bal>0?'red':''}">${fmt(st(p.id).bal)}</td><td class="r"><button class="sm" onclick="detail('${p.id}')">Detay</button> <button class="sm" onclick="editPerson('${p.id}')">Düzenle</button> <button class="sm" onclick="togglePerson('${p.id}')">${p.active?'Pasife al':'Aktif et'}</button> <button class="sm dg" onclick="delPerson('${p.id}')">Sil</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Henüz kişi yok. “Yeni kişi” ile başlayın.</td></tr>'}</table></div>`}

/* products */
function editProd(id){const p=S.products.find(x=>x.id==id)||{name:'',cat:'',price:0,unit:'Adet'};
 form(id?'Ürünü düzenle':'Yeni ürün',[{k:'name',l:'Ürün adı *',v:p.name,r:1},{k:'cat',l:'Kategori',v:p.cat,t:'dl',o:[...new Set(['İçecek','Yiyecek',...liveProd().map(x=>x.cat).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'tr'))},{k:'price',l:'Birim fiyat (₺) *',v:id?(p.price/100):'',t:'number',r:1},{k:'unit',l:'Birim türü',v:cap(p.unit),t:'select',o:['Adet','Porsiyon','Bardak','Kg','Litre'].map(x=>[x,x])}],v=>{
  const k=toK(v.price);if(!v.name.trim())return 'Ürün adı gerekli.';if(isNaN(k)||k<0)return 'Geçerli bir fiyat girin.';
  Object.assign(id?p:(p={id:uid(),active:true},S.products.push(p),p),{name:v.name.trim(),cat:v.cat,unit:v.unit,price:k})})}
function toggleProd(id){const p=S.products.find(x=>x.id==id);p.active=!p.active;save();render()}
function delProd(id){if(confirm('Ürün listeden kaldırılsın mı? Geçmiş işlemler etkilenmez.')){S.products.find(x=>x.id==id).deleted=true;save();render()}}
function pProducts(){return `<h2>Ürün Yönetimi</h2><div class="bar"><button class="pri" onclick="editProd()">+ Yeni ürün</button><span class="mu">Fiyat değişikliği geçmiş işlemleri etkilemez.</span></div><div class="card tw"><table><tr><th>Ürün</th><th>Kategori</th><th>Birim</th><th class="r">Fiyat</th><th>Durum</th><th></th></tr>${liveProd().map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${esc(cap(p.unit))}</td><td class="r">${fmt(p.price)}</td><td><span class="tag ${p.active?'g':'o'}">${p.active?'Aktif':'Pasif'}</span></td><td class="r"><button class="sm" onclick="editProd('${p.id}')">Düzenle / Fiyat</button> <button class="sm" onclick="toggleProd('${p.id}')">${p.active?'Pasife al':'Aktif et'}</button> <button class="sm dg" onclick="delProd('${p.id}')">Sil</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Henüz ürün yok.</td></tr>'}</table></div>`}

/* new sale */
let rows=[{p:'',q:1,u:0}],salePid='';
const prodOpts=sel=>'<option value="">Ürün seçin</option>'+S.products.filter(p=>p.active&&!p.deleted).map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.name)} (${fmt(p.price)})</option>`).join('');
const rowTot=r=>Math.round((parseFloat(r.q)||0)*(r.u||0)),grand=()=>rows.reduce((s,r)=>s+(r.p?rowTot(r):0),0);
function drawRows(){$('#rows').innerHTML=rows.map((r,i)=>`<div class="line"><select onchange="rs(${i},this.value)">${prodOpts(r.p)}</select><input type="number" min="0" step="any" value="${r.q}" oninput="rq(${i},this.value)" aria-label="Miktar"><input type="number" value="${r.p?r.u/100:''}" disabled aria-label="Birim fiyat"><b id="lt${i}">${fmt(r.p?rowTot(r):0)}</b><button class="sm dg" onclick="rd(${i})" title="Satırı sil">✕</button></div>`).join('');gt()}
const gt=()=>{const e=$('#gt');if(e)e.textContent=fmt(grand())};
const lt=i=>{$('#lt'+i).textContent=fmt(rows[i].p?rowTot(rows[i]):0);gt()};
function rs(i,v){rows[i].p=v;const p=S.products.find(x=>x.id==v);rows[i].u=p?p.price:0;drawRows()}
function rq(i,v){rows[i].q=v;lt(i)}function ru(i,v){rows[i].u=Math.round(parseFloat(v)*100)||0;lt(i)}
function ra(){rows.push({p:'',q:1,u:0});drawRows()}function rd(i){rows.splice(i,1);if(!rows.length)rows=[{p:'',q:1,u:0}];drawRows()}
function saveSale(){const pid=$('#sp').value,msg=$('#smsg');
 if(!pid)return msg.textContent='Önce bir kişi seçin.';
 const ok=rows.filter(r=>r.p);if(!ok.length)return msg.textContent='En az bir ürün ekleyin.';
 if(ok.some(r=>!(parseFloat(r.q)>0)))return msg.textContent='Miktar sıfırdan büyük olmalı.';
 if(ok.some(r=>r.u<0))return msg.textContent='Birim fiyat negatif olamaz.';
 const its=ok.map(r=>mkItem(S.products.find(x=>x.id==r.p),parseFloat(r.q),r.u));
 const t=addTx({type:'sale',pid,items:its,note:$('#sn').value});save();salePid=pid;rows=[{p:'',q:1,u:0}];render();toast(`Kaydedildi: ${pn(pid)} hesabına ${fmt(t.total)} eklendi`)}
function pSale(){if(!actPs().length||!liveProd().some(p=>p.active))return `<h2>Yeni İşlem</h2><div class="card empty">İşlem için en az bir aktif kişi ve bir aktif ürün gerekli.</div>`;
 setTimeout(drawRows);return `<h2>Yeni İşlem / Satış Kaydı</h2><div class="card"><label>Personel<select id="sp"><option value="">Kişi seçin</option>${actPs().map(p=>`<option value="${p.id}" ${p.id==salePid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div id="rows"></div><button onclick="ra()">+ Ürün ekle</button><div class="tot">Genel toplam: <span id="gt">${fmt(0)}</span></div><label>Açıklama<input id="sn"></label><p class="err" id="smsg"></p><div class="row"><button class="pri" onclick="saveSale()">Kaydet</button></div></div>`}

/* debts */
let dq='',ds='debt',dz=false;
function pDebts(){let l=livePs().map(p=>({p,...st(p.id)})).filter(x=>(dz||x.bal!=0)&&x.p.name.toLowerCase().includes(dq.toLowerCase()));
 l.sort((a,b)=>ds=='name'?a.p.name.localeCompare(b.p.name,'tr'):b.bal-a.bal);
 return `<h2>Borç Listesi</h2><div class="bar"><input placeholder="Personel ara…" value="${esc(dq)}" oninput="dq=this.value;rt()"><select onchange="ds=this.value;render()"><option value="debt" ${ds=='debt'?'selected':''}>Borca göre (çoktan aza)</option><option value="name" ${ds=='name'?'selected':''}>Ada göre</option></select><label style="margin:0"><input type="checkbox" style="width:auto" ${dz?'checked':''} onchange="dz=this.checked;render()"> Borcu sıfır olanları göster</label></div><div class="card tw" id="dt">${debtTbl(l)}</div>`}
const debtTbl=l=>`<table><tr><th>Personel</th><th class="r">Toplam alışveriş</th><th class="r">Toplam ödeme</th><th class="r">Güncel borç</th><th>Son işlem</th><th></th></tr>${l.map(x=>`<tr><td>${esc(x.p.name)}</td><td class="r">${fmt(x.spent)}</td><td class="r grn">${fmt(x.paid)}</td><td class="r ${x.bal>0?'red':''}"><b>${fmt(x.bal)}</b></td><td>${dt(x.last)}</td><td class="r"><button class="sm gn" onclick="payFor('${x.p.id}')">Ödeme al</button> <button class="sm" onclick="detail('${x.p.id}')">Detay</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Kayıt bulunamadı.</td></tr>'}</table>`;
function rt(){let l=livePs().map(p=>({p,...st(p.id)})).filter(x=>(dz||x.bal!=0)&&x.p.name.toLowerCase().includes(dq.toLowerCase()));l.sort((a,b)=>ds=='name'?a.p.name.localeCompare(b.p.name,'tr'):b.bal-a.bal);$('#dt').innerHTML=debtTbl(l)}

/* payments */
let payPid='';
function payFor(id){payPid=id;go('pay')}
function updBal(){const id=$('#pp').value;$('#pb').textContent=id?fmt(st(id).bal):'—'}
function savePay(){const pid=$('#pp').value,k=toK($('#pa').value),msg=$('#pmsg'),b=pid?st(pid).bal:0;
 if(!pid)return msg.textContent='Kişi seçin.';if(isNaN(k)||k<=0)return msg.textContent='Geçerli bir ödeme tutarı girin.';
 if(k>b)return msg.textContent=`Ödeme borçtan fazla olamaz (güncel borç: ${fmt(b)}).`;
 let d=new Date();const v=$('#pd').value;if(v){const [y,m,dd]=v.split('-').map(Number);d.setFullYear(y,m-1,dd)}
 addTx({type:'payment',pid,total:k,method:$('#pm').value,date:d.toISOString(),note:$('#pn').value,items:[]});save();payPid=pid;render();toast(`Ödeme kaydedildi. Kalan borç: ${fmt(st(pid).bal)}`)}
function pPay(){const ps=livePs().filter(p=>st(p.id).bal>0||p.id==payPid);setTimeout(updBal);
 return `<h2 style="text-align:center">Ödeme İşlemleri</h2><div class="card ctr"><label>Personel<select id="pp" onchange="updBal()"><option value="">Kişi seçin</option>${ps.map(p=>`<option value="${p.id}" ${p.id==payPid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><p>Güncel borç: <b id="pb" class="red">—</b></p><label>Ödeme tutarı (₺)<input id="pa" type="number" min="0" step="0.01"></label><label>Ödeme yöntemi<select id="pm"><option>Nakit</option><option>Havale</option><option>Diğer</option></select></label><label>Ödeme tarihi<input id="pd" type="date" value="${today()}" max="${today()}"></label><label>Açıklama<input id="pn"></label><p class="err" id="pmsg"></p><div class="row" style="justify-content:center"><button class="gn" onclick="savePay()">Ödemeyi kaydet</button></div></div>`}

/* log */
let lq='';
function cancelTx(id){const o=S.txs.find(t=>t.id==id);if(!confirm(`#${o.no} numaralı işlem iptal edilsin mi? Eski kayıt korunur, ters kayıt oluşturulur.`))return;
 if(cancelled(id))return;addTx({type:'reversal',ot:o.type,of:o.id,pid:o.pid,items:o.items,total:o.total,method:o.method,note:'İptal edilen işlem #'+o.no});save();render();toast('İptal kaydı oluşturuldu')}
function pLog(){const l=[...S.txs].sort((a,b)=>b.no-a.no).filter(t=>(pn(t.pid)+' '+(t.note||'')+' '+t.no).toLowerCase().includes(lq.toLowerCase()));
 return `<h2>İşlem Geçmişi</h2><div class="bar"><input placeholder="Ara (ad, no, açıklama)…" value="${esc(lq)}" oninput="lq=this.value;clearTimeout(lt_);lt_=setTimeout(()=>{render();const i=$('.bar input');i.focus();i.setSelectionRange(99,99)},300)"><button onclick="csv()">CSV indir</button></div><div class="card tw"><table><tr><th>No</th><th>Tarih</th><th>Personel</th><th>Tür</th><th>Detay</th><th class="r">Toplam</th><th>Açıklama</th><th></th></tr>${l.map(t=>`<tr style="${cancelled(t.id)?'opacity:.55':''}"><td>#${t.no}</td><td>${dt(t.date)}</td><td>${esc(pn(t.pid))}</td><td>${tag(t)}${cancelled(t.id)?' <span class="tag o">İptal edildi</span>':''}</td><td>${items(t)}</td><td class="r">${fmt(t.total)}</td><td>${esc(t.note||'')}</td><td>${t.type!='reversal'&&!cancelled(t.id)?`<button class="sm dg" onclick="cancelTx('${t.id}')">İptal et</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Kayıt yok.</td></tr>'}</table></div>`}
let lt_;
function csv(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const r=[['No','Tarih','Personel','Tür','Detay','Toplam (TL)','Açıklama'].map(q).join(';')];
 S.txs.forEach(t=>r.push([t.no,dt(t.date),pn(t.pid),TL[t.type],(t.items||[]).map(i=>`${i.qty} ${i.name} x ${i.price/100}`).join(' | ')||t.method||'',(t.total/100).toFixed(2).replace('.',','),t.note||''].map(q).join(';')));
 dl('islem-gecmisi.csv','\ufeff'+r.join('\n'),'text/csv')}
function dl(n,c,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:m}));a.download=n;a.click()}

/* dashboard */
function chart(f,col){const ds=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=day(d);ds.push([d.toLocaleDateString('tr-TR',{weekday:'short'}),S.txs.filter(t=>day(t.date)==k).reduce((s,t)=>s+f(t),0)])}
 const m=Math.max(...ds.map(x=>x[1]),1);return `<div class="chart">${ds.map(x=>`<div title="${fmt(x[1])}"><span>${x[1]?Math.round(x[1]/100):''}</span><i style="height:${Math.max(x[1]/m*90,2)}px;background:${col}"></i>${x[0]}</div>`).join('')}</div>`}
function pDash(){const k=today(),tt=S.txs.filter(t=>day(t.date)==k),all=livePs().map(p=>({p,...st(p.id)})),debt=all.reduce((s,x)=>s+x.bal,0);
 const lst=(a)=>a.map(t=>`<tr><td>${dt(t.date)}</td><td>${esc(pn(t.pid))}</td><td>${tag(t)}</td><td class="r">${fmt(t.total)}</td></tr>`).join('')||'<tr><td class="empty">Kayıt yok</td></tr>';
 const rec=[...S.txs].sort((a,b)=>b.no-a.no);
 return `<h2>Ana Sayfa</h2><div class="grid"><div class="card"><div class="k">Toplam personel</div><div class="v">${livePs().length}</div></div><div class="card"><div class="k">Toplam aktif borç</div><div class="v red">${fmt(debt)}</div></div><div class="card"><div class="k">Bugünkü alışveriş</div><div class="v">${fmt(tt.reduce((s,t)=>s+sd(t),0))}</div></div><div class="card"><div class="k">Bugünkü tahsilat</div><div class="v grn">${fmt(tt.reduce((s,t)=>s+pd(t),0))}</div></div></div>
 <div class="g2"><div class="card"><h3>En çok borcu olan 5 kişi</h3><table>${all.filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal).slice(0,5).map(x=>`<tr><td>${esc(x.p.name)}</td><td class="r red"><b>${fmt(x.bal)}</b></td></tr>`).join('')||'<tr><td class="empty">Borçlu yok</td></tr>'}</table></div>
 <div class="card"><h3>Son ödemeler</h3><div class="tw"><table>${lst(rec.filter(t=>t.type=='payment').slice(0,5))}</table></div></div>
 <div class="card" style="grid-column:1/-1"><h3>Günlük alışveriş (son 7 gün, ₺)</h3>${chart(sd,'#c23b32')}</div></div>
 <div class="card"><h3 style="text-align:center">Son 10 işlem</h3><div class="tw"><table>${lst(rec.slice(0,10))}</table></div></div>`}

/* reports */
let rf='',rto='';
function pRep(){const l=S.txs.filter(t=>(!rf||day(t.date)>=rf)&&(!rto||day(t.date)<=rto)),pr={};
 l.forEach(t=>{if(t.type=='payment'||(t.type=='reversal'&&t.ot=='payment'))return;const g=t.type=='sale'?1:-1;(t.items||[]).forEach(i=>{const o=pr[i.name]||(pr[i.name]={q:0,t:0});o.q+=g*i.qty;o.t+=g*i.total})});
 const ts=l.reduce((s,t)=>s+sd(t),0),tp=l.reduce((s,t)=>s+pd(t),0);
 return `<h2>Raporlar</h2><div class="bar"><label style="margin:0">Başlangıç <input type="date" value="${rf}" onchange="rf=this.value;render()"></label><label style="margin:0">Bitiş <input type="date" value="${rto}" onchange="rto=this.value;render()"></label></div>
 <div class="grid"><div class="card"><div class="k">Alışveriş</div><div class="v">${fmt(ts)}</div></div><div class="card"><div class="k">Tahsilat</div><div class="v grn">${fmt(tp)}</div></div><div class="card"><div class="k">Dönem farkı</div><div class="v ${ts-tp>0?'red':''}">${fmt(ts-tp)}</div></div></div>
 <div class="g2"><div class="card tw"><h3>Ürün bazında satış</h3><table><tr><th>Ürün</th><th class="r">Adet</th><th class="r">Tutar</th></tr>${Object.entries(pr).sort((a,b)=>b[1].t-a[1].t).map(([n,o])=>`<tr><td>${esc(n)}</td><td class="r">${o.q}</td><td class="r">${fmt(o.t)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Veri yok</td></tr>'}</table></div>
 <div class="card tw"><h3>Kişi bazında (tüm zamanlar)</h3><table><tr><th>Kişi</th><th class="r">Alışveriş</th><th class="r">Ödeme</th><th class="r">Borç</th></tr>${livePs().map(p=>({p,...st(p.id)})).sort((a,b)=>b.bal-a.bal).map(x=>`<tr><td>${esc(x.p.name)}</td><td class="r">${fmt(x.spent)}</td><td class="r grn">${fmt(x.paid)}</td><td class="r ${x.bal>0?'red':''}">${fmt(x.bal)}</td></tr>`).join('')}</table></div></div>`}

/* settings */
function pSet(){return `<h2 style="text-align:center">Ayarlar</h2><div class="card ctr"><h3>Giriş bilgileri</h3><label>Kullanıcı ID<input id="cid" value="${esc(A.id)}"></label><label>Mevcut şifre *<input id="cp0" type="password" autocomplete="current-password"></label><label>Yeni şifre (değiştirmeyecekseniz boş bırakın)<input id="cp1" type="password" autocomplete="new-password"></label><label>Yeni şifre (tekrar)<input id="cp2" type="password" autocomplete="new-password"></label><p class="err" id="cmsg"></p><div class="row" style="justify-content:center"><button class="pri" onclick="chgPw()">Bilgileri güncelle</button></div></div><div class="card ctr"><h3>Veri yönetimi</h3><p class="mu">Veriler bu tarayıcıda (LocalStorage) saklanır. Düzenli yedek almanız önerilir.</p><div class="bar"><button class="pri" onclick="dl('isletme-defteri-yedek-'+today()+'.json',JSON.stringify(S,null,1),'application/json')">Yedek indir (JSON)</button><label class="btn" style="margin:0">Yedekten yükle<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button onclick="if(confirm('Mevcut veriler silinip örnek verilerle değiştirilsin mi?')){seed();render()}">Örnek verileri yükle</button><button class="dg" onclick="if(confirm('TÜM veriler kalıcı olarak silinsin mi? Önce yedek almanız önerilir.')){S={seq:0,persons:[],products:[],txs:[]};save();render()}">Tüm verileri sıfırla</button></div></div>`}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.persons||!d.products||!d.txs)throw 0;if(confirm('Mevcut veriler yedekteki verilerle değiştirilsin mi?')){S=d;save();render();toast('Yedek yüklendi')}}catch(e){alert('Geçersiz yedek dosyası.')}};r.readAsText(f)}

/* auth */
const AK='isletmedefteri.auth',hs=s=>{s='idf:'+s;let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
let A;try{A=JSON.parse(localStorage[AK])}catch(e){}
if(!A||!A.id)A={id:'Mürsel',h:hs('1234')};
const saveA=()=>{try{localStorage[AK]=JSON.stringify(A)}catch(e){}},tl=s=>s.trim().toLocaleLowerCase('tr'),authed=()=>sessionStorage.getItem('ida')=='1';
let tries=0,lock=0;
function showLogin(){$('#sb').innerHTML='';$('#app').innerHTML='';$('#login').style.display='flex';$('#lu').value='';$('#lp').value='';$('#lerr').textContent='';$('#lu').focus()}
$('#lf').onsubmit=e=>{e.preventDefault();const er=$('#lerr');
 if(Date.now()<lock)return er.textContent=`Çok fazla hatalı deneme. ${Math.ceil((lock-Date.now())/1000)} sn bekleyin.`;
 if(tl($('#lu').value)==tl(A.id)&&hs($('#lp').value)==A.h){tries=0;sessionStorage.setItem('ida','1');$('#login').style.display='none';render()}
 else{if(++tries>=5){tries=0;lock=Date.now()+30000;er.textContent='5 hatalı deneme. 30 saniye bekleyin.'}else er.textContent='ID veya şifre hatalı.';$('#lp').value=''}};
function logout(){sessionStorage.removeItem('ida');showLogin()}
function chgPw(){const g=i=>$(i).value,m=$('#cmsg');m.className='err';
 if(hs(g('#cp0'))!=A.h)return m.textContent='Mevcut şifre yanlış.';
 const id=g('#cid').trim(),n=g('#cp1');
 if(!id)return m.textContent='Kullanıcı ID boş olamaz.';
 if(n&&n.length<4)return m.textContent='Yeni şifre en az 4 karakter olmalı.';
 if(n!=g('#cp2'))return m.textContent='Yeni şifreler eşleşmiyor.';
 A.id=id;if(n)A.h=hs(n);saveA();['#cp0','#cp1','#cp2'].forEach(i=>$(i).value='');m.className='grn';m.textContent='Bilgiler güncellendi. Sonraki girişte yeni bilgileri kullanın.'}

/* router */
const PG=[['dash','Ana Sayfa',pDash],['persons','Kişi Yönetimi',pPersons],['products','Ürün Yönetimi',pProducts],['sale','Yeni İşlem',pSale],['debts','Borç Listesi',pDebts],['pay','Ödeme İşlemleri',pPay],['log','İşlem Geçmişi',pLog],['rep','Raporlar',pRep],['set','Ayarlar',pSet]];
let page=location.hash.slice(1)||'dash';
function go(p){page=p;location.hash=p;render()}
function render(){if(!authed())return showLogin();if(!PG.some(x=>x[0]==page))page='dash';$('#sb').innerHTML='<h1>İŞLETME DEFTERİ</h1>'+PG.map(x=>`<a class="${x[0]==page?'on':''}" onclick="go('${x[0]}')" tabindex="0" onkeydown="if(event.key=='Enter')go('${x[0]}')">${x[1]}</a>`).join('')+`<a onclick="logout()" tabindex="0" onkeydown="if(event.key=='Enter')logout()" style="margin-top:14px;border-top:1px solid #2f3b66;border-radius:0">Çıkış (${esc(A.id)})</a>`;$('#app').innerHTML=PG.find(x=>x[0]==page)[2]()}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!=page){page=h;render()}});
render();
</script></body></html>
